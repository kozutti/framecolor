name: Checks
on: [push, pull_request]
jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          sh -n contrib/install.sh contrib/uninstall.sh contrib/package.sh contrib/framecolor-lut contrib/get.sh
          sh -n contrib/framecolorctl contrib/framecolor-guard
          sh -n tests/test_guard.sh tests/test_framecolorctl.sh tests/test_framecolor_lut.sh tests/run_look_test.sh
          sh tests/test_guard.sh
          sh tests/test_framecolorctl.sh
          sh tests/test_framecolor_lut.sh
          sh tests/run_look_test.sh
      - name: Test LUT generator
        run: python3 -m unittest discover -s tests -v
